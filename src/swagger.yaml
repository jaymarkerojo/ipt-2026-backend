openapi: 3.0.0
info:
  title: Node.js Sign-up and Verification API
  version: 1.0.0
  description: Node.js + MySQL - API with email sign-up, verification, authentication and forgot password
servers:
  - url: http://localhost:4000
    description: Local development server
  - url: https://angular-21-boilerplate-backend.onrender.com
    description: Production server
paths:
  /accounts/authenticate:
    post:
      summary: Authenticate account credentials and return a JWT token and a cookie with a refresh token
      responses:
        '200':
          description: Authentication successful
  /accounts/refresh-token:
    post:
      summary: Use a refresh token to generate a new JWT token and a new refresh token
      responses:
        '200':
          description: Token refreshed
  /accounts/revoke-token:
    post:
      summary: Revoke a refresh token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token revoked
  /accounts/register:
    post:
      summary: Register a new user account and send a verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
              required:
                - title
                - firstName
                - lastName
                - email
                - password
                - confirmPassword
      responses:
        '200':
          description: Registration successful
  /accounts/verify-email:
    post:
      summary: Verify a new account with a verification token received by email after registration
      responses:
        '200':
          description: Email verified
  /accounts/forgot-password:
    post:
      summary: Submit email address to reset the password on an account
      responses:
        '200':
          description: Password reset email sent
  /accounts/validate-reset-token:
    post:
      summary: Validate the reset password token received by email after submitting to the /accounts/forgot-password route
      responses:
        '200':
          description: Token validated
  /accounts/reset-password:
    post:
      summary: Reset the password for an account
      responses:
        '200':
          description: Password reset successful
  /accounts:
    get:
      summary: Get a list of all accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts retrieved successfully
    post:
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
                role:
                  type: string
                  enum: [Admin, User]
              required:
                - title
                - firstName
                - lastName
                - email
                - password
                - confirmPassword
                - role
      responses:
        '200':
          description: Account created successfully
  /accounts/{id}:
    get:
      summary: Get a single account by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account retrieved successfully
    put:
      summary: Update an account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
                role:
                  type: string
                  enum: [Admin, User]
      responses:
        '200':
          description: Account updated successfully
    delete:
      summary: Delete an account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account deleted successfully
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
