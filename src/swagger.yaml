openapi: 3.0.0

info:
  title: Node.js Sign-up and Verification API
  version: 1.0.0
  description: Node.js + MySQL API with authentication, email verification, and password reset

servers:
  - url: http://localhost:4000
    description: Local server
  - url: https://angular-21-boilerplate-backend.onrender.com
    description: Production server

security:
  - bearerAuth: []

tags:
  - name: Accounts
    description: Account management and authentication

paths:

  /accounts/authenticate:
    post:
      tags: [Accounts]
      summary: Authenticate user and return JWT + refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwtToken:
                    type: string
        "401":
          description: Invalid credentials

  /accounts/register:
    post:
      tags: [Accounts]
      summary: Register new user and send verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, firstName, lastName, email, password, confirmPassword]
              properties:
                title:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: Registration successful
        "400":
          description: Validation error

  /accounts/verify-email:
    post:
      tags: [Accounts]
      summary: Verify email using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified
        "400":
          description: Invalid token

  /accounts:
    get:
      tags: [Accounts]
      summary: Get all accounts
      responses:
        "200":
          description: List of accounts

    post:
      tags: [Accounts]
      summary: Create account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, firstName, lastName, email, password, role]
              properties:
                title:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [Admin, User]
      responses:
        "200":
          description: Account created

  /accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account found
        "404":
          description: Not found

    put:
      tags: [Accounts]
      summary: Update account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated

    delete:
      tags: [Accounts]
      summary: Delete account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT